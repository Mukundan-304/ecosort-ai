apiVersion: apps/v1
kind: Deployment
metadata: {name: ecosort-ai, labels: {app: ecosort-ai}}
spec:
  replicas: 1
  selector: {matchLabels: {app: ecosort-ai}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app: ecosort-ai}}
    spec:
      containers:
      - name: app
        image: YOUR_DOCKERHUB_USER/ecosort-ai:latest        # Jenkins replaces the tag on every build
        imagePullPolicy: Always
        ports: [{containerPort: 8501}]
        env: [{name: ECOSORT_BACKEND, value: "auto"}]
        resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 3Gi}}
        startupProbe: {httpGet: {path: /_stcore/health, port: 8501}, periodSeconds: 10, failureThreshold: 30}
        readinessProbe: {httpGet: {path: /_stcore/health, port: 8501}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /_stcore/health, port: 8501}, periodSeconds: 20, failureThreshold: 3}
---
apiVersion: v1
kind: Service
metadata: {name: ecosort-ai}
spec: {type: LoadBalancer, selector: {app: ecosort-ai}, ports: [{port: 80, targetPort: 8501}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: ecosort-ai}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ecosort-ai}
  minReplicas: 1
  maxReplicas: 3
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
